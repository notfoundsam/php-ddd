x-shared-env: &shared-env
  PHP_MEMORY_LIMIT: 256M
  PHP_UPLOAD_MAX_FILESIZE: 20M
  PHP_POST_MAX_SIZE: 25M
  # Database settings
  RDS_HOSTNAME: db
  RDS_DB_NAME: development
  RDS_USERNAME: root
  RDS_PASSWORD: root
  # Cache settings
  REDIS_PRIMARY_ENDPOINT: redis
  REDIS_READER_ENDPOINT: redis
  # CDN settings
  CDN_IMAGES_URL: https://images.php-ddd.test
  # Queue (ElasticMQ local SQS)
  SQS_ASYNC_EVENTS_QUEUE_URL: http://elasticmq:9324/queue/async-events
  AWS_DEFAULT_REGION: ap-northeast-1
  # AWS SDK warns about PHP <8.1 EOL on every client construction; mute in dev
  # since FuelPHP's error handler escalates the deprecation notice to a fatal.
  AWS_SUPPRESS_PHP_DEPRECATION_WARNING: "true"
  # Email
  EMAIL_DOMAIN: php-ddd.test
  # SMS (Twilio) — TWILIO_API_BASE_URL routes to the local sms-mock-server in dev
  TWILIO_API_BASE_URL: http://sms:8080
  TWILIO_ACCOUNT_SID: ACdevelopmentaccountsidplaceholder
  TWILIO_AUTH_TOKEN: development-auth-token
  TWILIO_SMS_FROM: "+15005550006"
  TWILIO_CALLBACK_URL: ""

# Common environment for any container running the FuelPHP app code (web + workers).
# Merged via `<<: *fuelphp-env` so each service can add its own keys (e.g. PHP_IDE_CONFIG)
# without re-listing the shared ones.
x-fuelphp-env: &fuelphp-env
  <<: *shared-env
  FUEL_ENV: development
  APP_URL: https://php-ddd.test/
  APP_URL_ADMIN: https://admin.php-ddd.test/
  APP_URL_PARTNER: https://partner.php-ddd.test/
  APP_TOKEN_SALT: R2AvvgZcNEmmY6wbhPBMma4amsdUvHnLWvijER3a

# Base shape shared by the FuelPHP web container and all FuelPHP-based workers.
# YAML merge does NOT combine list-typed keys (volumes, depends_on), so each service
# defines those itself; common build/networks/env live here.
x-fuelphp-service: &fuelphp-service
  build:
    context: ./dev-tools/app-fuelphp
    dockerfile: php.dockerfile
  networks:
    - php-ddd

services:
  traefik:
    image: traefik:v2.10
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
      - "--providers.file.directory=/etc/traefik/dynamic"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./dev-tools/traefik:/etc/traefik/dynamic:ro
      - ./dev-tools/certs:/certs:ro
    networks:
      - php-ddd
    labels:
      - "traefik.enable=true"

  db:
    image: mysql:8.0.42
    command: mysqld --sql_mode="NO_ENGINE_SUBSTITUTION" --authentication_policy=mysql_native_password
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=development
    volumes:
      - php-ddd-db:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - php-ddd
  mail:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"  # SMTP (keep for direct access if needed)
    environment:
      - MP_MAX_MESSAGES=500
      - MP_SMTP_AUTH_ACCEPT_ANY=1
      - MP_SMTP_AUTH_ALLOW_INSECURE=1
    networks:
      - php-ddd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.mail.rule=Host(`mail.php-ddd.test`)"
      - "traefik.http.routers.mail.entrypoints=websecure"
      - "traefik.http.routers.mail.tls=true"
      - "traefik.http.services.mail.loadbalancer.server.port=8025"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.mail-http.rule=Host(`mail.php-ddd.test`)"
      - "traefik.http.routers.mail-http.entrypoints=web"
      - "traefik.http.routers.mail-http.middlewares=redirect-to-https"
  sms:
    image: notfoundsam/sms-mock-server:3.0.1
    environment:
      - SMS_MOCK_PORT=8080
      - SMS_MOCK_TIMEZONE=Asia/Tokyo
      - SMS_MOCK_DB_PATH=/data/mock_server.db
      - SMS_MOCK_PROVIDER=twilio
      - SMS_MOCK_MAX_MESSAGES=500
      - SMS_MOCK_TWILIO_ACCOUNT_SID=ACdevelopmentaccountsidplaceholder
      - SMS_MOCK_TWILIO_AUTH_TOKEN=development-auth-token
      - SMS_MOCK_TWILIO_ALLOWED_FROM_NUMBERS=+15005550006
    volumes:
      - php-ddd-sms:/data
    networks:
      - php-ddd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sms.rule=Host(`sms.php-ddd.test`)"
      - "traefik.http.routers.sms.entrypoints=websecure"
      - "traefik.http.routers.sms.tls=true"
      - "traefik.http.services.sms.loadbalancer.server.port=8080"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.sms-http.rule=Host(`sms.php-ddd.test`)"
      - "traefik.http.routers.sms-http.entrypoints=web"
      - "traefik.http.routers.sms-http.middlewares=redirect-to-https"
  redis:
    image: redis:7.4.2
    networks:
      - php-ddd
    ports:
      - "6379:6379"
  elasticmq:
    image: softwaremill/elasticmq-native:1.6.11
    volumes:
      - ./dev-tools/elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro
    networks:
      - php-ddd
    ports:
      - "9324:9324"
  nginx:
    build:
      context: ./dev-tools/app-fuelphp
      dockerfile: nginx.dockerfile
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf
      - ./dev-tools/nginx_default.conf:/etc/nginx/conf.d/default.conf
      - ./fuelphp/public:/app/fuelphp/public
      - ./laravel/public:/app/laravel/public
      - ./frontend/dist:/app/frontend/dist:ro
    networks:
      - php-ddd
    depends_on:
      - fuelphp
      - laravel
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`php-ddd.test`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls=true"
      - "traefik.http.services.app.loadbalancer.server.port=80"
      # Admin subdomain
      - "traefik.http.routers.app-admin.rule=Host(`admin.php-ddd.test`)"
      - "traefik.http.routers.app-admin.entrypoints=websecure"
      - "traefik.http.routers.app-admin.tls=true"
      - "traefik.http.routers.app-admin.service=app"
      # Partner subdomain
      - "traefik.http.routers.app-partner.rule=Host(`partner.php-ddd.test`)"
      - "traefik.http.routers.app-partner.entrypoints=websecure"
      - "traefik.http.routers.app-partner.tls=true"
      - "traefik.http.routers.app-partner.service=app"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.app-http.rule=Host(`php-ddd.test`)"
      - "traefik.http.routers.app-http.entrypoints=web"
      - "traefik.http.routers.app-http.middlewares=redirect-to-https"
      - "traefik.http.routers.app-admin-http.rule=Host(`admin.php-ddd.test`)"
      - "traefik.http.routers.app-admin-http.entrypoints=web"
      - "traefik.http.routers.app-admin-http.middlewares=redirect-to-https"
      - "traefik.http.routers.app-partner-http.rule=Host(`partner.php-ddd.test`)"
      - "traefik.http.routers.app-partner-http.entrypoints=web"
      - "traefik.http.routers.app-partner-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
  fuelphp:
    <<: *fuelphp-service
    environment:
      <<: *fuelphp-env
      PHP_IDE_CONFIG: serverName=Docker
    volumes:
      - ./backend:/app/backend
      - ./fuelphp:/app/fuelphp
      - ./frontend/dist:/app/fuelphp/public/build:ro
      - ./storage:/app/storage
      - ./docker/php-custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php-fpm-docker.conf:/usr/local/etc/php-fpm.d/zzz-docker.conf
    depends_on:
      - redis
      - db
      - mail
      - sms
      - elasticmq

  worker-async:
    <<: *fuelphp-service
    command: php /app/fuelphp/oil refine worker:async
    environment:
      <<: *fuelphp-env
    volumes:
      - ./backend:/app/backend
      - ./fuelphp:/app/fuelphp
      - ./storage:/app/storage
      - ./docker/php-custom.ini:/usr/local/etc/php/conf.d/custom.ini
    depends_on:
      - redis
      - db
      - elasticmq

  laravel:
    build:
      context: ./dev-tools/app-laravel
      dockerfile: php.dockerfile
    environment:
      <<: *shared-env
      APP_NAME: PhpDdd
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://php-ddd.test
      PHP_IDE_CONFIG: serverName=DockerLaravel
    volumes:
      - ./backend:/app/backend
      - ./laravel:/app/laravel
      - ./frontend/dist:/app/laravel/public/build:ro
      - ./storage:/app/storage
      - ./docker/php-custom.ini:/usr/local/etc/php/conf.d/custom.ini
      - ./docker/php-fpm-docker.conf:/usr/local/etc/php-fpm.d/zzz-docker.conf
    networks:
      - php-ddd
    depends_on:
      - redis
      - db
      - mail
      - sms

  frontend:
    image: node:24-alpine
    working_dir: /app/frontend
    command: sh -c "npm install --no-audit --no-fund && npm run watch"
    volumes:
      - ./frontend:/app/frontend
      - php-ddd-frontend-node-modules:/app/frontend/node_modules
    networks:
      - php-ddd

  cdn:
    image: nginx:alpine
    volumes:
      - ./storage:/usr/share/nginx/html:ro
      - ./dev-tools/cdn-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - php-ddd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.cdn.rule=Host(`images.php-ddd.test`)"
      - "traefik.http.routers.cdn.entrypoints=websecure"
      - "traefik.http.routers.cdn.tls=true"
      - "traefik.http.services.cdn.loadbalancer.server.port=80"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.cdn-http.rule=Host(`images.php-ddd.test`)"
      - "traefik.http.routers.cdn-http.entrypoints=web"
      - "traefik.http.routers.cdn-http.middlewares=redirect-to-https"
      # Add cache headers middleware
      - "traefik.http.middlewares.cdn-cache.headers.customResponseHeaders.Cache-Control=public, max-age=31536000, immutable"
      - "traefik.http.middlewares.cdn-cache.headers.customResponseHeaders.X-CDN=local-cdn"
      - "traefik.http.routers.cdn.middlewares=cdn-cache"

  dashboard:
    image: b4bz/homer:latest
    volumes:
      - ./dev-tools/dashboard:/www/assets
    networks:
      - php-ddd
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`dashboard.php-ddd.test`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.services.dashboard.loadbalancer.server.port=8080"
      # HTTP to HTTPS redirect
      - "traefik.http.routers.dashboard-http.rule=Host(`dashboard.php-ddd.test`)"
      - "traefik.http.routers.dashboard-http.entrypoints=web"
      - "traefik.http.routers.dashboard-http.middlewares=redirect-to-https"

networks:
  php-ddd:
    driver: bridge

volumes:
  php-ddd-db:
  php-ddd-frontend-node-modules:
  php-ddd-sms:
