
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    server_tokens off;

    # Define trusted proxy networks (ALB private IPs)
    set_real_ip_from 10.1.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Map to sanitize X-Forwarded-For header
    map $http_x_forwarded_for $sanitized_xff {
        "~^([0-9]{1,3}\.){3}[0-9]{1,3}" $http_x_forwarded_for;
        default "invalid";
    }

    log_format main escape=json '{'
              '"time_local":"$time_local",'
              '"remote_addr":"$remote_addr",'
              '"real_ip":"$realip_remote_addr",'
              '"request":"$request",'
              '"status":$status,'
              '"body_bytes_sent":$body_bytes_sent,'
              '"request_time":$request_time,'
              '"http_referrer":"$http_referer",'
              '"http_user_agent":"$http_user_agent",'
              '"http_x_forwarded_for":"$sanitized_xff",'
              '"host":"$host",'
              '"request_method":"$request_method",'
              '"request_uri":"$request_uri",'
              '"upstream_addr":"$upstream_addr",'
              '"upstream_status":"$upstream_status",'
              '"upstream_response_time":"$upstream_response_time"'
            '}';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;

    keepalive_timeout  65;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/css application/json application/javascript;

    include /etc/nginx/conf.d/*.conf;
}
