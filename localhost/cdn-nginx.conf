server {
    listen 80;
    server_name images.php-ddd.test;

    root /usr/share/nginx/html;

    # Disable access log for images
    access_log off;

    # Enable gzip compression for SVG
    gzip on;
    gzip_vary on;
    gzip_types image/svg+xml;
    gzip_min_length 1024;

    # Only serve image files
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|bmp|tiff|tif)$ {
        # CORS headers for cross-origin requests
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        # Cache headers
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        # Handle OPTIONS requests
        if ($request_method = 'OPTIONS') {
            return 204;
        }

        try_files $uri =404;
    }

    # Directory listing for root (development only)
    location = / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }

    # Deny access to all other file types
    location / {
        return 403;
    }
}
