server {
    listen 80;
    server_name images.php-ddd.test;

    # Public origin path; private files live elsewhere under /usr/share/nginx/html
    # and are unreachable through this server block. Mirrors a CloudFront
    # distribution whose origin path is /public/images on the S3 bucket.
    root /usr/share/nginx/html/public/images;

    access_log off;

    gzip on;
    gzip_vary on;
    gzip_types image/svg+xml;
    gzip_min_length 1024;

    location / {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, OPTIONS" always;

        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = 'OPTIONS') {
            return 204;
        }

        try_files $uri =404;
    }

    location = / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
    }
}
