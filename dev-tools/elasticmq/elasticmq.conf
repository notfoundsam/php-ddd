// ElasticMQ configuration for local development.
//
// Mirrors the production SQS shape: each main queue has a redrive policy
// pointing at its DLQ after MAX_RECEIVE_COUNT delivery attempts. Keep
// `maxReceiveCount` in sync with AsyncEventConfig::MAX_RECEIVE_COUNT.
//
// `node-address.host = elasticmq` matches the docker-compose service name
// so the QueueUrl the SDK receives is reachable from other containers.

include classpath("application.conf")

node-address {
    protocol = http
    host = elasticmq
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    // sqs-limits=strict matches AWS SQS validation; relaxed allows non-AWS names
    sqs-limits = strict
}

queues {
    # Main async events queue
    async-events {
        defaultVisibilityTimeout = 60 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
        deadLettersQueue {
            name = "async-events-dlq"
            maxReceiveCount = 5
        }
    }

    # Dead Letter Queue for failed async events
    async-events-dlq {
        defaultVisibilityTimeout = 60 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }

    # Twilio SMS status-callback queue — Twilio posts per-message delivery
    # status updates here (see TwilioSmsNotifier::statusCallback URL ending
    # in /twilio-callback). Provider-specific by design; other SMS providers
    # may not deliver callbacks at all.
    twilio-callback {
        defaultVisibilityTimeout = 60 seconds
        delay = 0 seconds
        receiveMessageWait = 0 seconds
    }
}
