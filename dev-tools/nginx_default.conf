server {
    listen 80;
    server_name _;

    # Block requests with malicious X-Forwarded-For headers
    if ($http_x_forwarded_for ~ "[\'\"\;\<\>\(\)\{\}]") {
        return 444;
    }

    # Block SQL injection patterns in headers (case insensitive)
    if ($http_x_forwarded_for ~* "(union|select|insert|drop|delete|truncate|script|javascript|vbscript|onload|onerror|xor|sysdate|sleep)") {
        return 444;
    }

    # Block dangerous characters in cookie values
    if ($http_cookie ~ "[@<>\\\\]") {
        return 444;
    }

    # Block excessive equals signs (malformed Base64 padding)
    if ($http_cookie ~ "={3,}") {
        return 444;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; frame-ancestors 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    index index.php;

    charset utf-8;

    client_max_body_size 20M;
    client_body_buffer_size 10M;

    # ============================================================
    # Laravel routes — add migrated paths here
    # Example: location /api/v2 { ... }
    # ============================================================

    # location /api/v2 {
    #     alias /app/laravel/public;
    #     try_files $uri $uri/ @laravel;
    # }
    #
    # location @laravel {
    #     fastcgi_pass laravel:9000;
    #     fastcgi_param SCRIPT_FILENAME /app/laravel/public/index.php;
    #     include fastcgi_params;
    #     fastcgi_read_timeout 300s;
    #     fastcgi_send_timeout 300s;
    # }

    # ============================================================
    # FuelPHP — default fallback (all non-Laravel routes)
    # ============================================================
    root /app/fuelphp/public;

    location = /healthcheck {
        access_log off;

        include fastcgi_params;
        fastcgi_pass fuelphp:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param PATH_INFO /healthcheck;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass fuelphp:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param QUERY_STRING $query_string;
        include fastcgi_params;

        fastcgi_read_timeout 300s;
        fastcgi_send_timeout 300s;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
